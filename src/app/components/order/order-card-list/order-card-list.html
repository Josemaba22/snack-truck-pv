<div class="order-card-list">
  @if (orders().length === 0) {
    <p class="order-card-list__empty">No hay órdenes por mostrar</p>
  } @else {
    <div class="order-card-list__grid" (pointerdown)="onSwipeStart($event)" (pointerup)="onSwipeEnd($event)">
      @for (order of pagedOrders(); track order.id) {
        <app-order-card [order]="order" (advance)="advance.emit($event)"></app-order-card>
      }
    </div>

    @if (pageCount() > 1) {
      <div class="order-card-list__dots">
        @for (page of pages(); track page) {
          <button
            type="button"
            class="order-card-list__dot"
            [class.order-card-list__dot--active]="page === currentPage()"
            [attr.aria-label]="'Ir a la página ' + (page + 1)"
            (click)="goToPage(page)"
          ></button>
        }
      </div>
    }
  }
</div>
