<div class="filters-bar">
  <input
    class="filters-bar__input"
    type="text"
    placeholder="Buscar orden #"
    [ngModel]="query()"
    (ngModelChange)="query.set($event)"
    (keyup.enter)="applyFilter()"
  />
  <button type="button" class="filters-bar__button" (click)="applyFilter()">Filtrar</button>
</div>
