<div class="orders-table__wrapper">
  <table class="orders-table">
    <thead>
      <tr>
        <th># Orden</th>
        <th>Fecha</th>
        <th>Total</th>
        <th>Pago</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (order of orders(); track order.id) {
        <tr>
          <td class="orders-table__number"># {{ order.orderNumber }}</td>
          <td>{{ order.createdAt | date: 'short' }}</td>
          <td class="orders-table__total">{{ order.total | currency }}</td>
          <td>{{ order.paymentMethod === 'CASH' ? 'Efectivo' : order.paymentMethod }}</td>
          <td>
            <span class="orders-table__status">Entregado</span>
          </td>
          <td>
            <button type="button" class="orders-table__view" (click)="viewOrder.emit(order)">Ver</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="orders-table__empty">No hay órdenes entregadas</td>
        </tr>
      }
    </tbody>
  </table>
</div>
