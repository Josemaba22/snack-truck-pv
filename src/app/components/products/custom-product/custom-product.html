<section class="custom-product">
  <header class="custom-product__header">
    <button type="button" class="custom-product__back" (click)="back.emit()">Inicio</button>
    <h2 class="custom-product__title">Nuevo Snack</h2>
  </header>

  <div class="custom-product__banner">
    <span class="custom-product__name">{{ product().name }}</span>
    <span class="custom-product__price">{{ product().price | currency }}</span>
  </div>

  @if (loading()) {
    <p class="custom-product__loading">Cargando receta...</p>
  } @else {
    <div class="custom-product__body" [style.--total-rows]="baseRows() + extraRows()">
      <section class="custom-product__panel" [style.--rows]="baseRows()">
        <header class="custom-product__panel-header">
          <h3 class="custom-product__panel-title">Ingredientes</h3>
          <span class="custom-product__panel-hint">Toca uno para quitarlo</span>
        </header>

        <app-ingredient-picker
          [ingredients]="baseIngredients()"
          [selectedIds]="includedBaseIds()"
          [columns]="gridColumns()"
          [showPrice]="false"
          emptyMessage="Este producto no tiene ingredientes base"
          (toggled)="onBaseIngredientToggled($event)"
        ></app-ingredient-picker>
      </section>

      <section class="custom-product__panel" [style.--rows]="extraRows()">
        <header class="custom-product__panel-header">
          <h3 class="custom-product__panel-title">Extras</h3>
          <span class="custom-product__panel-hint">Toca uno para agregarlo</span>
        </header>

        <app-ingredient-picker
          [ingredients]="extraIngredients()"
          [selectedIds]="addedExtraIds()"
          [columns]="gridColumns()"
          emptyMessage="Este producto no tiene extras disponibles"
          (toggled)="onExtraToggled($event)"
        ></app-ingredient-picker>
      </section>
    </div>

    <footer class="custom-product__footer">
      <label class="custom-product__notes">
        Nota
        <textarea
          rows="2"
          [ngModel]="notes()"
          (ngModelChange)="notes.set($event)"
          placeholder="Escribe una nota para este snack..."
        ></textarea>
      </label>
      <button type="button" class="custom-product__save" (click)="save()">Guardar Snack</button>
    </footer>
  }
</section>
