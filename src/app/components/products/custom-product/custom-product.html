<section class="custom-product">
  <header class="custom-product__header">
    <button type="button" class="custom-product__back" (click)="back.emit()">Inicio</button>
    <h2 class="custom-product__title">Nuevo Snack</h2>
  </header>

  <div class="custom-product__banner">
    <span class="custom-product__name">{{ product().name }}</span>
    <span class="custom-product__price">{{ product().price | currency }}</span>
  </div>

  @if (loading()) {
    <p class="custom-product__loading">Cargando extras...</p>
  } @else if (extrasOpen()) {
    <div class="custom-product__extras">
      <h3 class="custom-product__extras-title">Extras</h3>

      <app-product-addons
        [addons]="availableAddons()"
        [selectedIds]="selectedIds()"
        (toggled)="onAddonToggled($event)"
      ></app-product-addons>

      <button type="button" class="custom-product__cancel" (click)="toggleExtras()">Cancelar</button>
    </div>
  } @else {
    <div class="custom-product__body">
      <app-selected-addons
        [addons]="selectedAddons()"
        [interactive]="true"
        (removed)="onAddonRemoved($event)"
      ></app-selected-addons>

      <button type="button" class="custom-product__add-extra" (click)="toggleExtras()">
        <span class="custom-product__add-extra-icon" aria-hidden="true">+</span>
        Extra
      </button>
    </div>

    <footer class="custom-product__footer">
      <button type="button" class="custom-product__save" (click)="save()">Guardar Snack</button>
    </footer>
  }
</section>
