@if (ingredients().length === 0) {
  <p class="ingredient-picker__empty">{{ emptyMessage() }}</p>
} @else {
  <ul class="ingredient-picker" [style.--cols]="columns()" [style.--rows]="rows()">
    @for (ingredient of ingredients(); track ingredient.ingredientId) {
      <li class="ingredient-picker__cell">
        <button
          type="button"
          class="ingredient-picker__item"
          [class.ingredient-picker__item--selected]="isSelected(ingredient)"
          [attr.aria-pressed]="isSelected(ingredient)"
          (click)="toggled.emit(ingredient)"
        >
          <span class="ingredient-picker__media">
            @if (ingredient.ingredientImageUrl; as imageUrl) {
              <img
                class="ingredient-picker__image"
                [src]="imageUrl"
                [alt]="ingredient.ingredientName"
                loading="lazy"
              />
            } @else {
              <span class="ingredient-picker__initial" aria-hidden="true">
                {{ ingredient.ingredientName.charAt(0) }}
              </span>
            }
            <span class="ingredient-picker__badge" aria-hidden="true">
              {{ isSelected(ingredient) ? '✓' : '✕' }}
            </span>
          </span>
          <span class="ingredient-picker__name">{{ ingredient.ingredientName }}</span>
          @if (showPrice()) {
            <span class="ingredient-picker__price">{{
              ingredient.ingredientPrice | currency
            }}</span>
          }
        </button>
      </li>
    }
  </ul>
}
