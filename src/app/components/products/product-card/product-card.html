<article class="product">
  <button class="product__button" type="button" (click)="onSelect()">
    <div class="product__image-container">
      @if (product().imageUrl; as imageUrl) {
        <img class="product__image" [src]="imageUrl" [alt]="product().name" loading="lazy" />
      }
    </div>

    <span class="product__name">{{ product().name }}</span>
    <span class="product__price">{{ product().price | currency }}</span>
  </button>
</article>
