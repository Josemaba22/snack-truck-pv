<dialog #dialogEl class="app-dialog" [class.app-dialog--info]="tone() === 'info'" (cancel)="onCancel()">
  <div class="app-dialog__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"></circle>
      <line x1="12" y1="8" x2="12" y2="12.5"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
  </div>

  <h2 *ngIf="title()" class="app-dialog__title">{{ title() }}</h2>
  <p *ngIf="message()" class="app-dialog__message">{{ message() }}</p>

  <ng-content></ng-content>

  <div class="app-dialog__actions">
    <button type="button" class="app-dialog__cancel" (click)="onCancel()">{{ cancelLabel() }}</button>
    <button type="button" class="app-dialog__confirm" (click)="onConfirm()">{{ confirmLabel() }}</button>
  </div>
</dialog>
